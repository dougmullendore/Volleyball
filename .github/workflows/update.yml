name: Update the site

on:
  schedule:
    - cron: '47 10 * * *'   # every night, about 5:47am Central: scores and schedule
    - cron: '13 21 * * 1'   # Monday afternoon (about 4pm Central): look for the new top 25
    - cron: '13 2 * * 2'    # Monday evening (about 9pm Central): look again in case it came out late
    # match nights, August to December: every 15 minutes from about 3pm to midnight Central,
    # for live box scores. A run finds nothing to do and stops within seconds if no ranked team is playing.
    - cron: '*/15 20-23 * 8-12 *'
    - cron: '*/15 0-5 * 8-12 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', 'site/**', 'rosters/**', 'ratings/**', '.github/workflows/update.yml']

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # to keep the schedule switched on (last step)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Get what was stored last time
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state "$REPO_URL" state
          else
            mkdir state && git -C state init -q -b state
          fi
          mkdir -p state/logs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update the poll and the scoreboard, and build the page
        env:
          # The job itself looks for a new poll on Mondays. A run started by hand or by a
          # code change looks straight away, whatever the day.
          CHECK_POLL: ${{ github.event_name != 'schedule' && '1' || '0' }}
          # the match-night runs only refresh matches under way (see live_now in pipeline/run.py)
          RUN_MODE: ${{ contains(github.event.schedule, '*/15') && 'live' || 'full' }}
        run: |
          set -o pipefail
          python -m pipeline.run state dist 2>&1 | tee "$RUNNER_TEMP/run.log"
          if [ "$RUN_MODE" = live ]; then
            if [ -f dist/index.html ]; then cp "$RUNNER_TEMP/run.log" state/logs/live_run.log; fi
          else
            cp "$RUNNER_TEMP/run.log" state/logs/last_run.log
          fi

      - name: Save what was stored
        if: always()
        run: |
          cd state
          if [ -z "$(git status --porcelain)" ]; then echo "nothing new to store"; exit 0; fi
          git config user.name "volleyball-bot"
          git config user.email "volleyball-bot@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend -m "State as of $(date -u +%FT%TZ)" || true
          else
            git commit -q -m "State as of $(date -u +%FT%TZ)"
          fi
          git push -q -f "$REPO_URL" HEAD:state

      - name: Publish the site
        if: always() && hashFiles('dist/index.html') != ''
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "volleyball-bot"
          git config user.email "volleyball-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u +%FT%TZ)"
          git push -q -f "$REPO_URL" gh-pages

      # GitHub turns off scheduled jobs after 60 days without activity in the
      # repository (the off-season, say). Switching it on again each run resets that.
      - name: Keep the schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || echo "could not switch the schedule on; it may stop after 60 quiet days"
