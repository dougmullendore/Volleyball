name: Update the site

on:
  schedule:
    - cron: '47 10 * * *'   # every night, about 5:47am Central: scores and schedule
    - cron: '13 21 * * 1'   # Monday afternoon (about 4pm Central): look for the new top 25
    - cron: '13 2 * * 2'    # Monday evening (about 9pm Central): look again in case it came out late
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', 'site/**', 'rosters/**', 'ratings/**', '.github/workflows/update.yml']

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Get what was stored last time
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state "$REPO_URL" state
          else
            mkdir state && git -C state init -q -b state
          fi
          mkdir -p state/logs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update the poll and the scoreboard, and build the page
        env:
          # The job itself looks for a new poll on Mondays. A run started by hand or by a
          # code change looks straight away, whatever the day.
          CHECK_POLL: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: |
          set -o pipefail
          python -m pipeline.run state dist 2>&1 | tee state/logs/last_run.log

      - name: Save what was stored
        if: always()
        run: |
          cd state
          git config user.name "volleyball-bot"
          git config user.email "volleyball-bot@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend -m "State as of $(date -u +%FT%TZ)" || true
          else
            git commit -q -m "State as of $(date -u +%FT%TZ)"
          fi
          git push -q -f "$REPO_URL" HEAD:state

      - name: Publish the site
        if: always() && hashFiles('dist/index.html') != ''
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "volleyball-bot"
          git config user.email "volleyball-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u +%FT%TZ)"
          git push -q -f "$REPO_URL" gh-pages
