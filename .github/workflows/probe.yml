name: Probe data feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/probe.py out/probe
      - if: always()
        run: |
          cd out
          git init -q -b probe
          git config user.name "volleyball-bot"
          git config user.email "volleyball-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Probe $(date -u +%FT%TZ)"
          git push -q -f "$REPO_URL" probe
